<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Tracker 3D</title>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #map { width: 100%; height: 100%; }

    #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    .lbl {
      position: absolute; transform: translate(-50%, -170%);
      background: rgba(4,8,20,.88); border: 1px solid rgba(255,136,0,.55);
      border-radius: 5px; padding: 2px 8px;
      font-size: 10px; font-weight: 700; color: #ffaa44;
      white-space: nowrap; pointer-events: none;
    }
    .lbl.mil { border-color: rgba(60,220,100,.65); color: #55ee88; }
    .lbl b { font-weight: 700; }
    .lbl .lbl-sub { display: block; font-size: 8px; font-weight: 600;
      opacity: .72; letter-spacing: .3px; margin-top: 1px; }

    #header {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 16px;
      background: rgba(4,8,20,.9); border: 1px solid rgba(80,160,255,.22);
      border-radius: 14px; padding: 9px 22px;
      backdrop-filter: blur(14px); z-index: 10;
      pointer-events: all; white-space: nowrap; user-select: none;
    }
    #header h1 { font-size: 14px; font-weight: 700; color: #fff;
      letter-spacing: 1px; text-transform: uppercase; }
    #header h1 .live { color: #ff5500; }
    #header h1 .t3d { color: #4488ff; font-weight: 900; }
    .hdiv { width: 1px; height: 26px; background: rgba(255,255,255,.1); }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .stat-v { font-size: 17px; font-weight: 800; color: #ff6620; line-height: 1; }
    .stat-v.mv { color: #44ff88; }
    .stat-l { font-size: 9px; color: rgba(255,255,255,.38); text-transform: uppercase; letter-spacing: 1px; }

    #legend {
      position: fixed; top: 72px; left: 14px; z-index: 10;
      display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    }
    .lr { display: flex; align-items: center; gap: 7px;
      background: rgba(4,8,20,.82); border-radius: 7px; padding: 4px 10px;
      border: 1px solid rgba(255,255,255,.07); }
    .ld { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .ll { font-size: 10px; color: rgba(255,255,255,.58); font-weight: 600; }

    #regions {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 10; pointer-events: all;
    }
    .reg-btn {
      background: rgba(4,8,20,.82); border: 1px solid rgba(80,160,255,.22);
      border-radius: 20px; padding: 5px 14px;
      font-size: 11px; font-weight: 600; color: rgba(255,255,255,.55);
      cursor: pointer; backdrop-filter: blur(10px); transition: all .15s;
    }
    .reg-btn:hover  { color: #fff; border-color: rgba(255,136,0,.5); }
    .reg-btn.active { background: rgba(255,85,0,.28); border-color: #ff5500; color: #fff; }

    #info-panel {
      position: fixed; top: 110px; right: 14px; width: 240px;
      background: rgba(4,8,20,.93); border: 1px solid rgba(80,160,255,.28);
      border-radius: 14px; padding: 15px;
      backdrop-filter: blur(14px); z-index: 10; display: none; pointer-events: all;
    }
    #info-panel.open { display: block; }
    #info-panel.mp   { border-color: rgba(60,200,80,.45); }
    #info-close { position: absolute; top: 8px; right: 10px;
      background: none; border: none; color: rgba(255,255,255,.3);
      cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 5px; }
    #info-close:hover { color: #fff; }
    .i-cs  { font-size: 21px; font-weight: 800; color: #fff; margin-bottom: 2px; }
    .i-sub { font-size: 11px; color: rgba(255,255,255,.4); margin-bottom: 10px; }
    .i-badge { display: inline-block; font-size: 9px; font-weight: 700;
      background: rgba(60,200,80,.2); border: 1px solid rgba(60,200,80,.5);
      color: #88ee88; border-radius: 4px; padding: 1px 6px; margin-left: 6px; letter-spacing: 1px; }
    .i-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .i-cell label { display: block; font-size: 9px; color: rgba(255,255,255,.36);
      text-transform: uppercase; letter-spacing: .9px; margin-bottom: 2px; }
    .i-cell span { font-size: 13px; font-weight: 700; color: #ff8844; }
    .i-cell span.mv { color: #88ee88; }

    #controls {
      position: fixed; right: 14px; bottom: 50px;
      display: flex; flex-direction: column; gap: 5px; z-index: 10; pointer-events: all;
    }
    .ctl { width: 36px; height: 36px;
      background: rgba(4,8,20,.82); border: 1px solid rgba(80,160,255,.22);
      border-radius: 9px; color: rgba(255,255,255,.6); cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(10px); transition: all .15s; }
    .ctl:hover { background: rgba(255,85,0,.22); border-color: #ff5500; color: #fff; }
    .ctl-sep { height: 6px; }
    .ctl.tgl.active { background: rgba(60,200,120,.30); border-color: #3cdc78; color: #aaffcc; }

    #legend-stats { display: flex; gap: 10px; padding: 5px 10px 3px;
      border-top: 1px solid rgba(255,255,255,.07); margin-top: 2px; }
    #legend-stats span { font-size: 11px; font-weight: 800; color: rgba(255,255,255,.55); }
    #legend-stats small { font-size: 8px; font-weight: 600; opacity: .65; text-transform: uppercase; letter-spacing: .5px; }
    #ls-ftr { color: #44ff88 !important; }
    #ls-tnk { color: #55aaff !important; }
    #ls-crg { color: #aa88ff !important; }

    /* Legend type filter */
    .lr[data-kind] { cursor: pointer; transition: all .15s; }
    .lr[data-kind]:hover { background: rgba(255,136,0,.15); border-color: rgba(255,136,0,.4); }
    .lr[data-kind].inactive { opacity: 0.22; }
    #legend-clear { cursor: pointer; justify-content: center; }
    #legend-clear .ll { color: #ff8844 !important; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
    #legend-clear:hover .ll { color: #ff5500 !important; }

    /* Follow mode */
    #follow-bar {
      display: none; position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
      background: rgba(255,85,0,.3); border: 1px solid rgba(255,100,0,.7);
      border-radius: 20px; padding: 5px 16px;
      font-size: 11px; font-weight: 600; color: #ffcc88;
      z-index: 10; pointer-events: all; cursor: pointer;
      backdrop-filter: blur(10px); white-space: nowrap;
    }
    #follow-bar.active { display: block; }

    /* Info panel extras */
    #i-kind { font-size: 10px; color: rgba(255,255,255,.38); margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: 1px; }
    #i-follow { width: 100%; margin-top: 10px; padding: 5px 8px;
      background: rgba(255,85,0,.12); border: 1px solid rgba(255,136,0,.35);
      border-radius: 6px; color: #ff9944; cursor: pointer; font-size: 11px; font-weight: 600; }
    #i-follow:hover { background: rgba(255,85,0,.25); }
    #i-follow.following { background: rgba(255,85,0,.35); border-color: #ff5500; color: #fff; }

    #status-bar {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 7px;
      background: rgba(4,8,20,.72); border: 1px solid rgba(80,160,255,.15);
      border-radius: 20px; padding: 5px 14px;
      pointer-events: none; backdrop-filter: blur(8px); z-index: 10;
    }
    .s-dot { width: 7px; height: 7px; border-radius: 50%; background: #00e87a;
      animation: blink 2s ease-in-out infinite; }
    .s-dot.warn { background: #ffaa00; animation: none; }
    .s-dot.err  { background: #ff4040; animation: none; }
    .s-dot.load { background: #4499ff; animation: none; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.2} }
    #status-msg { font-size: 11px; color: rgba(255,255,255,.48); }

    #splash { position: fixed; inset: 0; background: #010409;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      z-index: 999; transition: opacity .6s; }
    #splash.gone { opacity: 0; pointer-events: none; }
    .spin { width: 42px; height: 42px; border: 3px solid rgba(255,85,0,.18);
      border-top-color: #ff5500; border-radius: 50%; animation: rot .8s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }
    #splash p { font-size: 13px; color: rgba(255,255,255,.42); }
  </style>
</head>
<body>
<div id="map"></div>
<div id="labels"></div>
<div id="splash"><div class="spin"></div><p>Loading satellite map…</p></div>

<div id="header">
  <h1>✈ <span class="live">FLIGHT TRACKER</span> <span class="t3d">3D</span></h1>
  <div class="hdiv"></div>
  <div class="stat"><div class="stat-v mv" id="hdr-mil">—</div><div class="stat-l">Aircraft</div></div>
  <div class="hdiv"></div>
  <div class="stat"><div class="stat-v" id="hdr-time">—</div><div class="stat-l">Updated</div></div>
</div>

<div id="legend">
  <div class="lr" data-kind="fighter"><div class="ld" style="background:#22ff66"></div><div class="ll">Fighter / Trainer</div></div>
  <div class="lr" data-kind="tanker"><div class="ld" style="background:#55aaff"></div><div class="ll">Tanker</div></div>
  <div class="lr" data-kind="awacs"><div class="ld" style="background:#ffff44"></div><div class="ll">AWACS / ISR</div></div>
  <div class="lr" data-kind="cargo"><div class="ld" style="background:#aa88ff"></div><div class="ll">Cargo / Airlift</div></div>
  <div class="lr" data-kind="attack_heli"><div class="ld" style="background:#44ffcc"></div><div class="ll">Attack Heli</div></div>
  <div class="lr" data-kind="transport_heli"><div class="ld" style="background:#44ffaa"></div><div class="ll">Transport Heli</div></div>
  <div class="lr" id="legend-clear" style="display:none"><div class="ll">✕ Clear filter</div></div>
  <div id="legend-stats">
    <span id="ls-ftr">—<small> Ftr</small></span>
    <span id="ls-tnk">—<small> Tnk</small></span>
    <span id="ls-crg">—<small> Crg</small></span>
  </div>
</div>

<div id="regions">
  <button class="reg-btn active" data-region="middle_east">Middle East</button>
  <button class="reg-btn"        data-region="europe">Europe</button>
  <button class="reg-btn"        data-region="north_america">N. America</button>
  <button class="reg-btn"        data-region="asia">Asia Pacific</button>
  <button class="reg-btn"        data-region="global">Global</button>
</div>

<div id="info-panel">
  <button id="info-close">×</button>
  <div class="i-cs"  id="i-cs">—</div>
  <div class="i-sub" id="i-sub">—</div>
  <div id="i-kind">—</div>
  <div class="i-grid">
    <div class="i-cell"><label>Altitude</label><span id="i-alt">—</span></div>
    <div class="i-cell"><label>Speed</label>   <span id="i-spd">—</span></div>
    <div class="i-cell"><label>Heading</label> <span id="i-hdg">—</span></div>
    <div class="i-cell"><label>Type code</label><span id="i-typ">—</span></div>
  </div>
  <button id="i-follow">📍 Follow aircraft</button>
</div>
<div id="follow-bar">📍 Following <span id="follow-label">—</span> · click to stop</div>

<div id="controls">
  <button class="ctl" id="btn-tup"  title="Tilt up">▲</button>
  <button class="ctl" id="btn-tdn"  title="Tilt down">▼</button>
  <button class="ctl" id="btn-zin"  title="Zoom in">+</button>
  <button class="ctl" id="btn-zout" title="Zoom out">−</button>
  <div class="ctl-sep"></div>
  <button class="ctl tgl" id="btn-labels"  title="Toggle tags (L)">🏷</button>
  <button class="ctl tgl" id="btn-trails"  title="Toggle trails (T)">〜</button>
  <button class="ctl tgl" id="btn-stalks"  title="Toggle altitude lines (S)">┃</button>
  <button class="ctl tgl" id="btn-predict" title="Toggle prediction lines (P)">➤</button>
  <button class="ctl tgl" id="btn-detail"  title="Toggle tag detail (D)">ℹ</button>
  <div class="ctl-sep"></div>
  <button class="ctl tgl" id="btn-night"   title="Toggle night mode (N)">🌙</button>
</div>

<div id="status-bar">
  <div class="s-dot" id="s-dot"></div>
  <span id="status-msg">Initialising…</span>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// ── config ────────────────────────────────────────────────────
const REFRESH_MS = 15000;

// Real aircraft models: Flightradar24 open models (GPL-2) converted from
// glTF 1.0 → 2.0 (Three.js only loads 2.0) and committed to assets/, so they
// load locally with no setup. Keyed by each aircraft's real ICAO type code.
const MODEL_BASE = 'assets/';
// glTF-2.0 models committed in assets/ (real, textured airliner airframes).
const MODEL_HAVE = new Set([
  'a320','a321','a332','a333','b738','b744','b762','b763','b772','heli',
]);
// Per-model orientation corrections applied after auto-axis-detection in
// normaliseModel. Values are [rx, ry, rz] in degrees. Add any model whose
// nose ends up facing backwards after loading.
const MODEL_CORRECTIONS = {
  // Common fix: many models export nose on -X after our basis rotation
  // 'b744': [0, 180, 0],  // uncomment if 747-based models load backwards
};
// Military ICAO type → closest available airframe. Many military jets ARE
// airliner derivatives: KC-46 = 767, A330 MRTT = A330, E-7/P-8 = 737,
// KC-135/E-3 = 4-engine (stand-in 747), KC-10 = widebody.
const MIL_TYPE_MODEL = {
  KC46:'b762', K46:'b762', A310:'b762',
  K35R:'b763', K35E:'b763', KC135:'b763', VC10:'b763', C135:'b763', C137:'b763', C32:'b762',
  KC10:'b772', DC10:'b772', MD11:'b772',
  E3TF:'b744', E3CF:'b744', E3D:'b744', E3:'b744', E3S:'b744', E767:'b744', E4:'b744',
  P3:'b744', P3C:'b744', RC135:'b744', WC135:'b744', TC135:'b744', OC135:'b744',
  E7:'b738', E7W:'b738', P8:'b738', B38M:'b738', C40:'b738',
  A332:'a332', A333:'a333',
  // fighters, C-17/C-130/A400 transports and helicopters keep their purpose-built
  // procedural shapes (no airliner looks right), so they are intentionally absent.
};
// Resolve an aircraft to a committed model basename, or null to keep the
// procedural shape. Tries the military map first, then the raw ICAO code.
function modelForType(typeCode) {
  const t = (typeCode || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!t) return null;
  if (MIL_TYPE_MODEL[t] && MODEL_HAVE.has(MIL_TYPE_MODEL[t])) return MIL_TYPE_MODEL[t];
  const lc = t.toLowerCase();
  if (MODEL_HAVE.has(lc)) return lc;
  return null;
}
// Target length (in geometry units) every loaded model is scaled to before its
// uniform-size factor is recorded.
const MODEL_TARGET_UNITS = 14;
// Aircraft are drawn as FIXED-PIXEL 3D icons: each model is projected at its
// ground anchor point, then rendered at a constant pixel size with an
// orthographic transform. Size is therefore independent of zoom, pitch and
// camera distance — models can never balloon, even near the horizon.
const ICON_PX = 65; // on-screen size (px) at reference zoom (scale grows with zoom)
// Altitude is now rendered using the REAL mercator z coordinate so aircraft
// sit at their true 3D position — height scales with zoom just like terrain.
const EARTH_CIRC = 2 * Math.PI * 6371009; // metres, used for mercator altitude
// Multiply real altitude by this factor so aircraft appear clearly elevated.
// Pure mercator altitude at cruise (35000 ft) is ~0.5% of globe — barely visible.
const ALTITUDE_EXAG = 4;
const TRAIL_MAX = 40;   // max position samples to store per aircraft

const REGION_VIEWS = {
  middle_east:   { center: [45,  27], zoom: 5.5, pitch: 72 },
  europe:        { center: [10,  50], zoom: 4.5, pitch: 68 },
  north_america: { center: [-95, 38], zoom: 4.0, pitch: 68 },
  asia:          { center: [110, 30], zoom: 4.0, pitch: 68 },
  global:        { center: [20,  25], zoom: 2.5, pitch: 55 },
};

// ── state ─────────────────────────────────────────────────────
let currentRegion = 'middle_east';
let flightMap     = new Map(); // hex → {lat,lon,displayAltM,track,kind,...}
const trailHistory = new Map(); // hex → [{x,y,alt}] mercator coords + altitude
let threeRenderer, map;

// ── view toggles (persisted in localStorage) ──────────────────
const prefs = JSON.parse(localStorage.getItem('flt-prefs') || '{}');
let SHOW_LABELS  = prefs.labels   !== false;
let SHOW_TRAILS  = prefs.trails   !== false;
let SHOW_STALKS  = prefs.stalks   !== false;
let LABEL_DETAIL = prefs.detail   !== false;
let SHOW_PREDICT = prefs.predict  !== false; // heading prediction lines
let NIGHT_MODE   = prefs.night    === true;  // dark map tiles
function savePrefs() {
  localStorage.setItem('flt-prefs', JSON.stringify({
    labels: SHOW_LABELS, trails: SHOW_TRAILS, stalks: SHOW_STALKS,
    detail: LABEL_DETAIL, predict: SHOW_PREDICT, night: NIGHT_MODE }));
}

// ── type filter & follow ───────────────────────────────────────
const FILTER_KINDS = new Set(); // empty = show all; non-empty = show only these kinds
let followHex = null, followInterval = null, panelHex = null;

// ── MapLibre ──────────────────────────────────────────────────
map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      sat: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256, attribution: '© Esri',
      },
    },
    layers: [{ id: 'sat', type: 'raster', source: 'sat' }],
  },
  center: REGION_VIEWS.middle_east.center,
  zoom:   REGION_VIEWS.middle_east.zoom,
  pitch:  REGION_VIEWS.middle_east.pitch,
  maxPitch: 85,
  canvasContextAttributes: {antialias: true},
});
map.on('load', () => {
  document.getElementById('splash').classList.add('gone');
  map.addLayer(threeLayer);
  startFetching();
});

// ── materials ─────────────────────────────────────────────────
// PBR flat-shaded materials: flatShading=true makes every polygon face catch
// light at its own angle, giving a distinctive low-poly game aesthetic even
// with simple geometry.
function mat(color, emissive, ei = 0.35) {
  return new THREE.MeshStandardMaterial({
    color, emissive, emissiveIntensity: ei,
    metalness: 0.3, roughness: 0.5,
    flatShading: true, side: THREE.DoubleSide });
}
const M = {
  fighter:  mat(0x44ff88, 0x0d4020),
  tanker:   mat(0x55bbff, 0x0d2a55),
  awacs:    mat(0xffdd44, 0x55380a),
  awacsDsk: mat(0xffee44, 0x6a4800, 0.7),
  cargo:    mat(0xbb99ff, 0x2a1f55),
  atkHeli:  mat(0x44ffcc, 0x0a3d2e),
  trnHeli:  mat(0x44ffaa, 0x0a3a1f),
  civJet:   mat(0xff9955, 0x4a2606),
  civProp:  mat(0xffbb44, 0x4a2e06),
  civHeli:  mat(0xff8844, 0x4a1f06),
};
// RGB trail colours per aircraft kind (0–1 range, used as vertex colours)
const KIND_TRAIL = {
  fighter:        [0.27, 1.00, 0.53],
  tanker:         [0.33, 0.73, 1.00],
  awacs:          [1.00, 0.87, 0.27],
  cargo:          [0.73, 0.60, 1.00],
  attack_heli:    [0.27, 1.00, 0.80],
  transport_heli: [0.27, 1.00, 0.67],
  civil_jet:      [1.00, 0.60, 0.33],
  civil_prop:     [1.00, 0.73, 0.27],
  civil_heli:     [1.00, 0.53, 0.27],
};

// ── geometry helpers ──────────────────────────────────────────
// Fuselage convention: nose → +X, wings span ±Z, up → +Y
// cylX  = cylinder lying along X axis
// coneX = cone with tip at +X  (nose)
// coneMX= cone with tip at -X  (tail)
function cylX(r1, r2, len, seg = 10) {
  const g = new THREE.CylinderGeometry(r1, r2, len, seg);
  g.applyMatrix4(new THREE.Matrix4().makeRotationZ(Math.PI / 2));
  return g;
}
function coneX(r, h, seg = 10) {
  const g = new THREE.ConeGeometry(r, h, seg);
  g.applyMatrix4(new THREE.Matrix4().makeRotationZ(-Math.PI / 2));
  return g;
}
function coneMX(r, h, seg = 10) {
  const g = new THREE.ConeGeometry(r, h, seg);
  g.applyMatrix4(new THREE.Matrix4().makeRotationZ(Math.PI / 2));
  return g;
}
function addM(g, geom, mat, px=0, py=0, pz=0, rx=0, ry=0, rz=0, sx=1, sy=1, sz=1) {
  const m = new THREE.Mesh(geom, mat);
  m.position.set(px, py, pz);
  if (rx||ry||rz) m.rotation.set(rx, ry, rz);
  if (sx!==1 || sy!==1 || sz!==1) m.scale.set(sx, sy, sz);
  m.frustumCulled = false;
  g.add(m);
}
function grp() {
  const g = new THREE.Group();
  g.frustumCulled = false;
  return g;
}
// Flat panel extruded from a 2D outline — gives real taper & sweep instead of
// plain rectangular boxes. `plane` selects the orientation:
//   'xz' → outline in (chord X, span), thin in Y  → horizontal wings/stabs
//   'xy' → outline in (chord X, height Y), thin in Z → vertical fins
function panel(pts, thick, plane = 'xz') {
  const shape = new THREE.Shape();
  shape.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false });
  geo.translate(0, 0, -thick / 2);
  if (plane === 'xz') geo.rotateX(-Math.PI / 2); // span → Z, thickness → Y
  return geo;
}
// Add a swept, tapered wing PAIR mirrored about the centreline.
// o: { rootLE, rootTE, tipLE, tipTE, tip, thick, y, dihedral }
function addWings(g, m, o) {
  const half = [
    [o.rootLE, 0], [o.tipLE, o.tip], [o.tipTE, o.tip], [o.rootTE, 0],
  ];
  for (const sgn of [1, -1]) {
    const pts = half.map(([x, y]) => [x, y * sgn]);
    const mesh = new THREE.Mesh(panel(pts, o.thick ?? 0.18, 'xz'), m);
    mesh.position.y = o.y || 0;
    if (o.dihedral) mesh.rotation.x = -sgn * o.dihedral; // wingtips angle up
    mesh.frustumCulled = false;
    g.add(mesh);
  }
}
// Add a single vertical fin (outline in chord X / height Y), optional cant.
function addFin(g, m, pts, thick, px = 0, py = 0, pz = 0, cant = 0) {
  const mesh = new THREE.Mesh(panel(pts, thick, 'xy'), m);
  mesh.position.set(px, py, pz);
  if (cant) mesh.rotation.y = cant;
  mesh.frustumCulled = false;
  g.add(mesh);
}

// A small low-poly bubble canopy (squashed octahedron-ish sphere) sitting on
// top of the fuselage — reads instantly as "cockpit".
function canopy(g, m, px, len, wid, ht, py = 0.45) {
  addM(g, new THREE.SphereGeometry(1, 8, 5), m, px, py, 0, 0, 0, 0, len, ht, wid);
}

// ── Three.js custom layer ─────────────────────────────────────
// KEY PATTERN: model at scene origin; camera = mercatorMatrix × aircraft_transform
// This is the official MapLibre approach — proven to work.
const threeLayer = (() => {
  let cam, tpl, loader, stalkScene;
  const modelCache = new Map(); // FR24 basename → { scene } | 'loading' | 'failed'
  // Pre-allocated matrices to avoid GC pressure in render loop
  const M4 = new THREE.Matrix4();
  const Pst = new THREE.Matrix4(); // per-aircraft stalk projection
  const Pic = new THREE.Matrix4(); // per-aircraft fixed-pixel icon projection
  const Iden = new THREE.Matrix4(); // identity (trail pass renders raw NDC)

  function mkScene(model) {
    const sc = new THREE.Scene();
    sc.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xfff8e0, 1.8);
    sun.position.set(1, 1.5, 0.8);
    sc.add(sun);
    const fill = new THREE.DirectionalLight(0xd0eeff, 0.7);
    fill.position.set(-1, 0.5, -1);
    sc.add(fill);
    const bottom = new THREE.DirectionalLight(0xffffff, 0.3);
    bottom.position.set(0, -1, 0); // subtle under-lighting so dark faces aren't pitch black
    sc.add(bottom);
    model.traverse(o => { o.frustumCulled = false; });
    sc.add(model);
    sc.userData.model = model;
    // Record a uniform-size factor so every model — procedural or loaded glTF —
    // renders at the same on-screen size: longest bounding axis → 1 unit.
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3(); box.getSize(size);
    sc.userData.unitScale = 1 / (Math.max(size.x, size.y, size.z) || 1);
    return sc;
  }

  // A screen-aligned vertical quad: x ∈ [-0.5, 0.5] (width), y ∈ [0, 1] (base
  // at ground → top at aircraft). The per-aircraft Pst matrix maps it directly
  // into clip space so the bar is always a thin, camera-facing altitude line.
  function makeStalkScene() {
    const g = new THREE.PlaneGeometry(1, 1);
    g.translate(0, 0.5, 0); // base at y=0, top at y=1
    const m = new THREE.MeshBasicMaterial({
      color: 0x44eeff, transparent: true, opacity: 0.6,
      depthTest: false, depthWrite: false, side: THREE.DoubleSide });
    const quad = new THREE.Mesh(g, m);
    quad.frustumCulled = false;
    const sc = new THREE.Scene();
    sc.add(quad);
    return sc;
  }

  // Canonicalise a loaded glTF to the convention nose→+X, up→+Y so ALL models
  // face the same way regardless of how they were authored. Different source
  // models use different axes (some Y-up, some Z-up, some fuselage-on-Y), so
  // we detect them from the bounding box: thinnest axis = vertical (up),
  // longest = fuselage (forward). Then recenter and scale to a uniform size.
  function normaliseModel(root, rotDeg) {
    const wrap = new THREE.Group();
    wrap.frustumCulled = false;

    let box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3(); box.getSize(size);
    const dims = [size.x, size.y, size.z];
    const AX = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];
    const upI  = dims.indexOf(Math.min(...dims)); // thinnest → vertical
    let fwdI   = dims.indexOf(Math.max(...dims));  // longest  → fuselage
    if (fwdI === upI) fwdI = (upI + 1) % 3;
    const eUp = AX[upI], eFwd = AX[fwdI];
    const eSide = new THREE.Vector3().crossVectors(eFwd, eUp);
    // Rotation mapping model's (fwd,up,side) → world (X,Y,Z).
    const R = new THREE.Matrix4().makeBasis(eFwd, eUp, eSide).transpose();
    root.applyMatrix4(R);

    // Optional manual offset (degrees) to fix a nose-backwards model.
    if (rotDeg) {
      root.rotation.x += THREE.MathUtils.degToRad(rotDeg[0] || 0);
      root.rotation.y += THREE.MathUtils.degToRad(rotDeg[1] || 0);
      root.rotation.z += THREE.MathUtils.degToRad(rotDeg[2] || 0);
    }
    root.updateMatrixWorld(true);

    // Recenter, then scale so the fuselage length == MODEL_TARGET_UNITS.
    box = new THREE.Box3().setFromObject(root);
    const ctr = new THREE.Vector3(); box.getCenter(ctr);
    box.getSize(size);
    const k = MODEL_TARGET_UNITS / (Math.max(size.x, size.y, size.z) || 1);
    root.position.sub(ctr);

    const inner = new THREE.Group();
    inner.frustumCulled = false;
    inner.add(root);
    inner.scale.setScalar(k);
    inner.traverse(o => {
      o.frustumCulled = false;
      if (o.material) { o.material.depthTest = false; o.material.depthWrite = false; }
    });
    wrap.add(inner);
    return wrap;
  }

  function initLoader() {
    loader = new GLTFLoader();
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    loader.setDRACOLoader(draco);
    loader.setMeshoptDecoder(MeshoptDecoder);
  }

  // Pick the scene for an aircraft: a real FR24 model matching its ICAO type
  // code if available (loaded on demand and cached), otherwise the procedural
  // shape for its kind. Loading is async; the procedural shape shows meanwhile.
  function sceneFor(d) {
    const name = modelForType(d.typeCode);
    if (name) {
      const entry = modelCache.get(name);
      if (entry && entry !== 'loading' && entry !== 'failed') return entry.scene;
      if (!entry) {
        modelCache.set(name, 'loading');
        loader.load(MODEL_BASE + name + '.glb', (gltf) => {
          const corr = MODEL_CORRECTIONS[name] || null;
          modelCache.set(name, { scene: mkScene(normaliseModel(gltf.scene, corr)) });
          map.triggerRepaint();
        }, undefined, (err) => {
          modelCache.set(name, 'failed');
          console.warn(`[models] ${name}.glb failed, using built-in shape`, err?.message || err);
        });
      }
    }
    return tpl[d.kind] || null; // fallback while loading / when no match
  }

  return {
    id: '3d-aircraft', type: 'custom', renderingMode: '3d',

    onAdd(map, gl) {
      cam = new THREE.Camera();

      threeRenderer = new THREE.WebGLRenderer({
        canvas: map.getCanvas(), context: gl, antialias: true,
      });
      threeRenderer.autoClear = false; // ← critical: don't clear between aircraft draws

      tpl = {
        fighter:        mkScene(buildFighter()),
        tanker:         mkScene(buildTanker()),
        awacs:          mkScene(buildAWACS()),
        cargo:          mkScene(buildCargo()),
        attack_heli:    mkScene(buildAttackHeli()),
        transport_heli: mkScene(buildChinook()),
        civil_jet:      mkScene(buildCivJet()),
        civil_prop:     mkScene(buildCivProp()),
        civil_heli:     mkScene(buildCivHeli()),
      };

      initLoader();
      stalkScene = makeStalkScene();
    },

    render(gl, options) {
      // MapLibre v5: defaultProjectionData.mainMatrix maps mercator [0,1]
      // coordinates → clip space, matching MercatorCoordinate.fromLngLat.
      M4.fromArray(options.defaultProjectionData.mainMatrix);

      const dpr = window.devicePixelRatio || 1;

      const Me = M4.elements;
      const canvas = map.getCanvas();
      const halfW = canvas.width / 2, halfH = canvas.height / 2;

      // Clip-space position of a mercator point. Returns the homogeneous
      // [x, y, z, w] before the perspective divide.
      function fullClip(x, y, z) {
        return [
          Me[0]*x + Me[4]*y + Me[8]*z  + Me[12],
          Me[1]*x + Me[5]*y + Me[9]*z  + Me[13],
          Me[2]*x + Me[6]*y + Me[10]*z + Me[14],
          Me[3]*x + Me[7]*y + Me[11]*z + Me[15],
        ];
      }
      function groundClip(x, y) { return fullClip(x, y, 0); }
      const PROBE = 0.000004; // tiny mercator step for measuring NDC basis vectors
      threeRenderer.resetState();
      threeRenderer.clearDepth();

      // Zoom-scaled icon size: gentle growth so models look right at any zoom.
      // Math.pow(1.2, zoom-5) gives 1× at zoom 5, ~2.5× at zoom 10, capped at 3×.
      const zoom = map.getZoom();
      const zoomScale = Math.min(Math.pow(1.2, Math.max(0, zoom - 5)), 3);
      const ICON = ICON_PX * dpr * zoomScale;

      // ── Trails — each sample at its true 3D altitude via fullClip ─────────
      if (SHOW_TRAILS) {
        const trailMat = new THREE.LineBasicMaterial({
          vertexColors: true, transparent: true, opacity: 0.9,
          depthTest: false, depthWrite: false,
        });
        cam.projectionMatrix.copy(Iden);
        for (const [hex, d] of flightMap) {
          if (d.onGround) continue;
          if (FILTER_KINDS.size > 0 && !FILTER_KINDS.has(d.kind)) continue;
          const trail = trailHistory.get(hex);
          if (!trail || trail.length < 2) continue;
          const n = trail.length;
          const pos = new Float32Array(n * 3);
          const col = new Float32Array(n * 3);
          const rgb = KIND_TRAIL[d.kind] || [0.5, 0.8, 1.0];
          for (let i = 0; i < n; i++) {
            const t = i / (n - 1);
            const p = trail[i];
            const malt = (p.alt || 0) * 0.3048 * ALTITUDE_EXAG / EARTH_CIRC;
            const c = fullClip(p.x, p.y, malt);
            const w = c[3] || 1e-6;
            pos[i*3]   = c[0] / w;
            pos[i*3+1] = c[1] / w;
            pos[i*3+2] = Math.max(-0.999, Math.min(0.999, c[2] / w));
            col[i*3]   = rgb[0] * t;
            col[i*3+1] = rgb[1] * t;
            col[i*3+2] = rgb[2] * t;
          }
          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
          geo.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
          const line = new THREE.Line(geo, trailMat);
          line.frustumCulled = false;
          const trailSc = new THREE.Scene();
          trailSc.add(line);
          threeRenderer.render(trailSc, cam);
          geo.dispose();
        }
        trailMat.dispose();
      }

      // ── Heading prediction lines ──────────────────────────────────────────
      // Dotted forward-projection of each aircraft ~4 minutes ahead based on
      // current ground speed and track. Rendered as a segmented NDC line.
      if (SHOW_PREDICT) {
        const predMat = new THREE.LineBasicMaterial({
          vertexColors: true, transparent: true, opacity: 0.55,
          depthTest: false, depthWrite: false,
        });
        cam.projectionMatrix.copy(Iden);
        for (const [, d] of flightMap) {
          if (d.onGround || !d.gs || d.gs < 50) continue;
          if (FILTER_KINDS.size > 0 && !FILTER_KINDS.has(d.kind)) continue;
          const ground = maplibregl.MercatorCoordinate.fromLngLat([d.lon, d.lat], 0);
          const gx = ground.x, gy = ground.y;
          const malt = ((d.altFt ?? 0) * 0.3048 * ALTITUDE_EXAG) / EARTH_CIRC;
          const hRad = (d.track || 0) * Math.PI / 180;
          const speedMs = d.gs * 0.514444;
          const distM = speedMs * 240; // 4 minutes ahead
          const latRad = d.lat * Math.PI / 180;
          const px2 = gx + (distM * Math.sin(hRad)) / (EARTH_CIRC * Math.cos(latRad));
          const py2 = gy - (distM * Math.cos(hRad)) / EARTH_CIRC;
          const SEGS = 8;
          const pos = new Float32Array((SEGS + 1) * 3);
          const col = new Float32Array((SEGS + 1) * 3);
          const rgb = KIND_TRAIL[d.kind] || [0.5, 0.8, 1.0];
          let valid = true;
          for (let i = 0; i <= SEGS; i++) {
            const t = i / SEGS;
            const cx = gx + (px2 - gx) * t, cy = gy + (py2 - gy) * t;
            const cv = fullClip(cx, cy, malt);
            if (cv[3] <= 1e-6) { valid = false; break; }
            const w = cv[3];
            pos[i*3]   = cv[0] / w;
            pos[i*3+1] = cv[1] / w;
            pos[i*3+2] = Math.max(-0.999, Math.min(0.999, cv[2] / w));
            // fade from bright at aircraft to dim at tip
            const fade = 1.0 - t * 0.75;
            col[i*3] = rgb[0] * fade; col[i*3+1] = rgb[1] * fade; col[i*3+2] = rgb[2] * fade;
          }
          if (!valid) continue;
          // Render as dashed by drawing only odd segments
          for (let i = 0; i < SEGS; i += 2) {
            const sg = new THREE.BufferGeometry();
            const segPos = new Float32Array(6);
            segPos.set(pos.slice(i*3, i*3+3), 0);
            segPos.set(pos.slice((i+1)*3, (i+1)*3+3), 3);
            const segCol = new Float32Array(6);
            segCol.set(col.slice(i*3, i*3+3), 0);
            segCol.set(col.slice((i+1)*3, (i+1)*3+3), 3);
            sg.setAttribute('position', new THREE.Float32BufferAttribute(segPos, 3));
            sg.setAttribute('color', new THREE.Float32BufferAttribute(segCol, 3));
            const ln = new THREE.Line(sg, predMat);
            ln.frustumCulled = false;
            const sc2 = new THREE.Scene(); sc2.add(ln);
            threeRenderer.render(sc2, cam);
            sg.dispose();
          }
        }
        predMat.dispose();
      }

      // ── Aircraft as fixed-pixel 3D icons ──────────────────────────────────
      // Aircraft are placed at their TRUE 3D altitude by projecting (gx, gy, malt)
      // through the map matrix. Stalk goes from ground clip to aircraft clip.
      // Icon size is normalised to ICON px (×zoom scale) using ground-point basis
      // vectors so it can never balloon regardless of pitch or distance.
      const draw = [];
      for (const [, d] of flightMap) {
        if (d.onGround) continue;
        if (FILTER_KINDS.size > 0 && !FILTER_KINDS.has(d.kind)) continue;
        const sc = sceneFor(d);
        if (!sc) continue;
        const ground = maplibregl.MercatorCoordinate.fromLngLat([d.lon, d.lat], 0);
        const gx = ground.x, gy = ground.y;
        const malt = ((d.altFt ?? 0) * 0.3048 * ALTITUDE_EXAG) / EARTH_CIRC;
        const c0 = fullClip(gx, gy, 0);
        if (c0[3] <= 1e-6) continue;
        const cAlt = fullClip(gx, gy, malt);
        if (cAlt[3] <= 1e-6) continue;
        const paX = cAlt[0]/cAlt[3], paY = cAlt[1]/cAlt[3], paZ = cAlt[2]/cAlt[3];
        // Cull on the aircraft position (at altitude), not just ground
        if (paX < -1.4 || paX > 1.4 || paY < -1.4 || paY > 1.4) continue;
        // Keep ground NDC for basis vector computation
        const ndx = c0[0]/c0[3], ndy = c0[1]/c0[3];
        draw.push({ d, sc, gx, gy, ndx, ndy, paX, paY, paZ, c0, cAlt });
      }
      draw.sort((a, b) => b.paZ - a.paZ); // far → near

      for (const it of draw) {
        const { d, sc, gx, gy, ndx, ndy, paX, paY, paZ, c0, cAlt } = it;

        // Stalk: quad base at ground clip, top at aircraft clip.
        // Pst maps unit-quad (qx∈[-0.5,0.5], qy∈[0,1]) directly to clip space:
        //   qy=0 → ground clip coords   qy=1 → aircraft clip coords
        if (SHOW_STALKS) {
          const wNdc = (2.0 * dpr) / halfW;
          const dCx = cAlt[0] - c0[0], dCy = cAlt[1] - c0[1];
          const dCz = cAlt[2] - c0[2], dCw = cAlt[3] - c0[3];
          Pst.set(
            wNdc*c0[3], dCx, 0, c0[0],
            0,          dCy, 0, c0[1],
            0,          dCz, 0, c0[2],
            0,          dCw, 0, c0[3]);
          cam.projectionMatrix.copy(Pst);
          threeRenderer.render(stalkScene, cam);
        }

        // Ground-point basis vectors for orientation + scale (same as before).
        const P  = [ndx, ndy, c0[2]/c0[3]];
        const ce = fullClip(gx + PROBE, gy, 0);
        const cn = fullClip(gx, gy - PROBE, 0);
        const cu = fullClip(gx, gy, PROBE);
        if (ce[3] <= 1e-6 || cn[3] <= 1e-6 || cu[3] <= 1e-6) continue;
        const E = [ce[0]/ce[3]-P[0], ce[1]/ce[3]-P[1], ce[2]/ce[3]-P[2]];
        const N = [cn[0]/cn[3]-P[0], cn[1]/cn[3]-P[1], cn[2]/cn[3]-P[2]];
        const U = [cu[0]/cu[3]-P[0], cu[1]/cu[3]-P[1], cu[2]/cu[3]-P[2]];
        const eLen = Math.hypot(E[0]*halfW, E[1]*halfH);
        const nLen = Math.hypot(N[0]*halfW, N[1]*halfH);
        const us = sc.userData.unitScale || (1 / MODEL_TARGET_UNITS);
        const f  = (ICON * us) / (Math.max(eLen, nLen) || 1e-6);
        const Ex = E.map(v => v*f), Nx = N.map(v => v*f), Ux = U.map(v => v*f);
        const hd = THREE.MathUtils.degToRad(d.track || 0);
        const ch = Math.cos(hd), sh = Math.sin(hd);
        const fwd = [Nx[0]*ch + Ex[0]*sh, Nx[1]*ch + Ex[1]*sh, Nx[2]*ch + Ex[2]*sh];
        const lat = [Ex[0]*ch - Nx[0]*sh, Ex[1]*ch - Nx[1]*sh, Ex[2]*ch - Nx[2]*sh];

        // Place model at actual 3D altitude position (paX, paY, paZ).
        Pic.set(
          fwd[0], Ux[0], lat[0], paX,
          fwd[1], Ux[1], lat[1], paY,
          fwd[2], Ux[2], lat[2], paZ,
          0,      0,     0,      1);
        cam.projectionMatrix.copy(Pic);
        threeRenderer.render(sc, cam);
      }

      refreshLabels();
      map.triggerRepaint();
    },
  };
})();

// ── classify ─────────────────────────────────────────────────
// Checked top-to-bottom; first match wins.
// Type codes are already ICAO alphanumeric (no hyphens in practice), but
// we strip non-alnum just in case the feed sends e.g. "KC-135".
function classify(d) {
  const t  = (d.typeCode || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const cs = (d.callsign || '').toUpperCase();
  const gs = d.gs || 0, alt = d.altFt || 0;

  if (d.mil) {
    // ── AWACS / ISR / Command ──────────────────────────────────────
    // Rotodome, special antenna or electronic mission. Check before tankers
    // because E-3/E-6 type codes can look airliner-like.
    if (/^(E3|E3T|E3CF|E3D|E3S|E7|E7W|E2|E2C|E2D|E4|E6|E8|P3|P3C|P8|RC135|WC135|TC135|OC135|VC25|B70|WJET)/.test(t)) return 'awacs';
    if (/^(SNTRY|DISCO|ROOK|MAGIC|COBRA[0-9]|SWORD|JSTAR|OMEN|SPOOK|TORCH|HAWKEYE)/.test(cs)) return 'awacs';

    // ── Aerial tankers ─────────────────────────────────────────────
    // Check before cargo: KC-130 is a tanker variant of the C-130 airframe, so
    // "KC13" must match here before "C130" hits the cargo branch below.
    if (/^(KC46|KC10|KC13|KC130|K35R|K35E|K135|KE3|IL78|VC10|KDC10|DC10T|MRTT|FSTA)/.test(t)) return 'tanker';
    if (/^(A332|A333|A342|A310)/.test(t)) return 'tanker'; // A330/A310 MRTT variants
    if (/^(B762|B764|DC10)/.test(t))       return 'tanker'; // 767-based KC-46 / KC-10 variants
    if (/^(ARCO|TEXACO|BASHER|VAPOR|PETROL|DRAG|KETCH|MAKO|IRON|SHELL|OILER|FRESH|BLUE[0-9]|TOWLINE|SCATHE|PACK[0-9]|GRAY)/.test(cs)) return 'tanker';

    // ── Cargo / airlift ────────────────────────────────────────────
    if (/^(C17|C130|C5|C27|C295|A400|IL76|AN12|AN22|AN26|AN70|C141|C160|C2A|C9A|C130J|HC130|MC130|LC130|C5A|C5B|C5M|C40|C32|C37)/.test(t)) return 'cargo';
    // REACH / RCH = Air Mobility Command airlift (NOT tanker — common misclassification)
    if (/^(REACH|RCH|GLOBE|ATLAS|ASCOT|JAKE|ROCKY|RAIDR|COMET|ANVIL)/.test(cs) && gs < 560) return 'cargo';

    // ── Helicopters ────────────────────────────────────────────────
    if (/^(AH64|AH1|EC665|TIGR|A129|LYNX|SA342|BO105|MD530|OH58|UH72)/.test(t)) return 'attack_heli';
    if (/^(CH47|CH53|S61|S70|UH60|UH1|HH60|NH90|EC725|AS33|MI8|MI17|V22|MH60|SH60|MH53|HH53|CH46|EH101|AW101|AW139|AS532)/.test(t)) return 'transport_heli';
    if (gs < 80 && alt < 15000) return 'transport_heli';

    return 'fighter'; // fast-movers, trainers, recon jets, UAVs
  }

  // ── Civil ──────────────────────────────────────────────────────
  if (/^(R[0-9]|EC[0-9]|AW[0-9]|H[0-6]|S76|B06|BK1|MD9|AS3|AS5|EC13|R44|R66|B407)/.test(t)) return 'civil_heli';
  if (gs < 80) return 'civil_heli';
  if (gs < 300 && alt < 20000) return 'civil_prop';
  return 'civil_jet';
}

// ── labels ────────────────────────────────────────────────────
const labelsEl = document.getElementById('labels');
const labelEls = new Map();

function refreshLabels() {
  if (!SHOW_LABELS || map.getZoom() < 3.5) { labelsEl.style.display = 'none'; return; }
  labelsEl.style.display = '';
  const W = window.innerWidth, H = window.innerHeight;
  const vis = new Set();

  for (const [hex, d] of flightMap) {
    if (d.onGround) continue;
    if (FILTER_KINDS.size > 0 && !FILTER_KINDS.has(d.kind)) continue;
    const px = map.project([d.lon, d.lat]);
    if (px.x < -30 || px.y < -30 || px.x > W+30 || px.y > H+30) continue;
    vis.add(hex);
    let el = labelEls.get(hex);
    if (!el) {
      el = document.createElement('div');
      el.className = 'lbl' + (d.mil ? ' mil' : '');
      labelsEl.appendChild(el);
      labelEls.set(hex, el);
    }
    const cs = d.callsign || hex.toUpperCase();
    if (LABEL_DETAIL) {
      // Callsign + a compact altitude · speed line (FLxxx, kts).
      const fl  = d.altFt != null ? 'FL' + String(Math.round(d.altFt / 100)).padStart(3, '0') : '—';
      const spd = d.gs != null ? Math.round(d.gs) + 'kt' : '';
      el.innerHTML = `<b>${cs}</b><span class="lbl-sub">${fl}${spd ? ' · ' + spd : ''}</span>`;
    } else {
      el.textContent = cs;
    }
    el.style.left  = px.x + 'px';
    el.style.top   = px.y + 'px';
    el.style.display = '';
  }
  for (const [hex, el] of labelEls)
    if (!vis.has(hex)) el.style.display = 'none';
}

// ── click to inspect ──────────────────────────────────────────
map.getCanvas().addEventListener('click', e => {
  const rect = map.getCanvas().getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  let best = null, bestD = 60 * 60;
  for (const [, d] of flightMap) {
    if (d.onGround) continue;
    const px = map.project([d.lon, d.lat]);
    const d2 = (px.x - cx) ** 2 + (px.y - cy) ** 2;
    if (d2 < bestD) { bestD = d2; best = d; }
  }
  if (best) {
    showPanel(best);
    // Smoothly centre on the clicked aircraft; zoom in if very zoomed out
    const targetZoom = Math.max(map.getZoom(), 7);
    map.easeTo({ center: [best.lon, best.lat], zoom: targetZoom, duration: 800 });
  }
});

const KIND_LABEL = {
  fighter: 'Fighter / Trainer', tanker: 'Aerial Tanker', awacs: 'AWACS / ISR',
  cargo: 'Cargo / Airlift', attack_heli: 'Attack Helicopter', transport_heli: 'Transport Helicopter',
  civil_jet: 'Civil Jet', civil_prop: 'Civil Prop', civil_heli: 'Civil Helicopter',
};
function showPanel(d) {
  panelHex = d.hex;
  document.getElementById('i-cs').innerHTML =
    (d.callsign || d.hex?.toUpperCase() || '—') +
    (d.mil ? '<span class="i-badge">MILITARY</span>' : '');
  document.getElementById('i-sub').textContent = d.reg
    ? `Reg: ${d.reg}` : (d.hex?.toUpperCase() || '—');
  document.getElementById('i-kind').textContent = KIND_LABEL[d.kind] || d.kind || '—';
  document.getElementById('i-alt').textContent =
    d.altFt != null ? `${Math.round(d.altFt).toLocaleString()} ft` : 'N/A';
  document.getElementById('i-spd').textContent =
    d.gs != null ? `${Math.round(d.gs)} kts` : 'N/A';
  document.getElementById('i-hdg').textContent =
    d.track != null ? `${Math.round(d.track)}°` : 'N/A';
  document.getElementById('i-typ').textContent = d.typeCode || '—';
  const followBtn = document.getElementById('i-follow');
  followBtn.textContent = followHex === d.hex ? '🔓 Unfollow aircraft' : '📍 Follow aircraft';
  followBtn.classList.toggle('following', followHex === d.hex);
  const p = document.getElementById('info-panel');
  p.classList.toggle('mp', !!d.mil);
  document.querySelectorAll('.i-cell span').forEach(s => s.classList.toggle('mv', !!d.mil));
  p.classList.add('open');
}

// ── fetch + update ────────────────────────────────────────────
function setStatus(cls, msg) {
  document.getElementById('s-dot').className = 's-dot' + (cls ? ' '+cls : '');
  document.getElementById('status-msg').textContent = msg;
}

async function fetchAndUpdate() {
  setStatus('load', 'Fetching flight data…');
  try {
    const r = await fetch(`/api/flights?region=${currentRegion}`,
                          { signal: AbortSignal.timeout(35000) });
    const j = await r.json();
    const list = j.aircraft ?? j.ac ?? [];

    const newMap = new Map();
    for (const s of list) {
      const hex = s.hex || s.icao24;
      if (!hex) continue;
      const lat = s.lat ?? s.latitude;
      const lon = s.lon ?? s.longitude;
      if (lat == null || lon == null) continue;

      const altFt    = typeof s.alt_baro === 'number' ? s.alt_baro
                     : typeof s.altitude  === 'number' ? s.altitude : null;
      const onGround = s.alt_baro === 'ground' || s.on_ground === true || s.on_ground === 1;

      const d = {
        hex, lat, lon, altFt, onGround,
        gs:       s.gs      ?? s.velocity    ?? null,
        track:    s.track   ?? s.true_track  ?? null,
        callsign: (s.flight ?? s.callsign    ?? '').trim(),
        typeCode: s.t       ?? s.type        ?? '',
        reg:      s.r       ?? s.registration ?? '',
        mil:      !!s.mil,
      };
      d.kind = classify(d);
      newMap.set(hex, d);
    }

    // Keep military aircraft only
    for (const [hex, d] of newMap) {
      if (!d.mil) newMap.delete(hex);
    }

    // Remove stale labels
    for (const [hex, el] of labelEls) {
      if (!newMap.has(hex)) { el.remove(); labelEls.delete(hex); }
    }

    flightMap = newMap;

    // Record trail positions (mercator coords) for each airborne aircraft.
    for (const [hex, d] of newMap) {
      if (d.onGround) continue;
      const mc = maplibregl.MercatorCoordinate.fromLngLat([d.lon, d.lat], 0);
      const trail = trailHistory.get(hex) || [];
      const last = trail[trail.length - 1];
      // Only append if the aircraft has moved a meaningful distance
      if (!last || Math.hypot(mc.x - last.x, mc.y - last.y) > 4e-6) {
        trail.push({ x: mc.x, y: mc.y, alt: d.altFt ?? 0 });
        if (trail.length > TRAIL_MAX) trail.shift();
      }
      trailHistory.set(hex, trail);
    }
    for (const hex of trailHistory.keys()) {
      if (!newMap.has(hex)) trailHistory.delete(hex);
    }

    const airborne = [...newMap.values()].filter(d => !d.onGround);
    const mil = airborne.length;
    const ftr = airborne.filter(d => d.kind === 'fighter').length;
    const tnk = airborne.filter(d => d.kind === 'tanker').length;
    const crg = airborne.filter(d => d.kind === 'cargo').length;
    document.getElementById('hdr-mil').textContent  = mil.toLocaleString();
    document.getElementById('ls-ftr').innerHTML  = `${ftr}<small> Ftr</small>`;
    document.getElementById('ls-tnk').innerHTML  = `${tnk}<small> Tnk</small>`;
    document.getElementById('ls-crg').innerHTML  = `${crg}<small> Crg</small>`;
    document.getElementById('hdr-time').textContent =
      new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    setStatus('', `${mil} military aircraft · refreshes every 15 s`);
  } catch(e) {
    setStatus('err', 'Could not reach server — retrying in 15 s');
    console.warn('[flights]', e);
  }
}

function startFetching() {
  fetchAndUpdate();
  setInterval(fetchAndUpdate, REFRESH_MS);
}

// ── UI controls ────────────────────────────────────────────────
document.querySelectorAll('.reg-btn').forEach(btn =>
  btn.addEventListener('click', () => {
    document.querySelectorAll('.reg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRegion = btn.dataset.region;
    const v = REGION_VIEWS[currentRegion];
    map.easeTo({ center: v.center, zoom: v.zoom, pitch: v.pitch, duration: 1200 });
    fetchAndUpdate();
  })
);
document.getElementById('btn-tup').addEventListener('click',  () => map.easeTo({ pitch: Math.min(map.getPitch()+10, 85), duration: 300 }));
document.getElementById('btn-tdn').addEventListener('click',  () => map.easeTo({ pitch: Math.max(map.getPitch()-10, 0),  duration: 300 }));
document.getElementById('btn-zin').addEventListener('click',  () => map.easeTo({ zoom: map.getZoom()+0.8, duration: 300 }));
document.getElementById('btn-zout').addEventListener('click', () => map.easeTo({ zoom: map.getZoom()-0.8, duration: 300 }));
document.getElementById('info-close').addEventListener('click', () =>
  document.getElementById('info-panel').classList.remove('open'));

// ── view toggles ───────────────────────────────────────────────
const SAT_TILES  = ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'];
const DARK_TILES = ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'];

function syncToggleUI() {
  document.getElementById('btn-labels') .classList.toggle('active', SHOW_LABELS);
  document.getElementById('btn-trails') .classList.toggle('active', SHOW_TRAILS);
  document.getElementById('btn-stalks') .classList.toggle('active', SHOW_STALKS);
  document.getElementById('btn-predict').classList.toggle('active', SHOW_PREDICT);
  document.getElementById('btn-detail') .classList.toggle('active', LABEL_DETAIL);
  document.getElementById('btn-night')  .classList.toggle('active', NIGHT_MODE);
}
function toggleLabels()  { SHOW_LABELS  = !SHOW_LABELS;  afterToggle(); }
function toggleTrails()  { SHOW_TRAILS  = !SHOW_TRAILS;  afterToggle(); }
function toggleStalks()  { SHOW_STALKS  = !SHOW_STALKS;  afterToggle(); }
function togglePredict() { SHOW_PREDICT = !SHOW_PREDICT; afterToggle(); }
function toggleDetail()  { LABEL_DETAIL = !LABEL_DETAIL; afterToggle(); }
function toggleNight()   {
  NIGHT_MODE = !NIGHT_MODE;
  map.getSource('sat').setTiles(NIGHT_MODE ? DARK_TILES : SAT_TILES);
  afterToggle();
}
function afterToggle() { savePrefs(); syncToggleUI(); refreshLabels(); map.triggerRepaint(); }
document.getElementById('btn-labels') .addEventListener('click', toggleLabels);
document.getElementById('btn-trails') .addEventListener('click', toggleTrails);
document.getElementById('btn-stalks') .addEventListener('click', toggleStalks);
document.getElementById('btn-predict').addEventListener('click', togglePredict);
document.getElementById('btn-detail') .addEventListener('click', toggleDetail);
document.getElementById('btn-night')  .addEventListener('click', toggleNight);
// Apply persisted night mode once the map has loaded (source exists by then)
if (NIGHT_MODE) {
  if (map.isStyleLoaded()) {
    map.getSource('sat').setTiles(DARK_TILES);
  } else {
    map.once('load', () => map.getSource('sat').setTiles(DARK_TILES));
  }
}
syncToggleUI();

// ── legend type filter ─────────────────────────────────────────
document.querySelectorAll('.lr[data-kind]').forEach(el => {
  el.addEventListener('click', () => {
    const k = el.dataset.kind;
    if (FILTER_KINDS.has(k)) FILTER_KINDS.delete(k);
    else FILTER_KINDS.add(k);
    const hasFilter = FILTER_KINDS.size > 0;
    document.querySelectorAll('.lr[data-kind]').forEach(e =>
      e.classList.toggle('inactive', hasFilter && !FILTER_KINDS.has(e.dataset.kind)));
    document.getElementById('legend-clear').style.display = hasFilter ? '' : 'none';
    map.triggerRepaint();
    refreshLabels();
  });
});
document.getElementById('legend-clear').addEventListener('click', () => {
  FILTER_KINDS.clear();
  document.querySelectorAll('.lr[data-kind]').forEach(e => e.classList.remove('inactive'));
  document.getElementById('legend-clear').style.display = 'none';
  map.triggerRepaint();
  refreshLabels();
});

// ── follow mode ────────────────────────────────────────────────
function startFollow(hex) {
  followHex = hex;
  const label = flightMap.get(hex)?.callsign || hex.toUpperCase();
  document.getElementById('follow-label').textContent = label;
  document.getElementById('follow-bar').classList.add('active');
  if (followInterval) clearInterval(followInterval);
  followInterval = setInterval(() => {
    const fd = flightMap.get(followHex);
    if (!fd) { stopFollow(); return; }
    map.panTo([fd.lon, fd.lat], { duration: 2000, easing: t => t * (2 - t) });
  }, 3000);
}
function stopFollow() {
  followHex = null;
  if (followInterval) { clearInterval(followInterval); followInterval = null; }
  document.getElementById('follow-bar').classList.remove('active');
  // Refresh panel button if open
  if (panelHex && flightMap.has(panelHex)) showPanel(flightMap.get(panelHex));
}
document.getElementById('follow-bar').addEventListener('click', stopFollow);
document.getElementById('i-follow').addEventListener('click', () => {
  if (!panelHex) return;
  if (followHex === panelHex) stopFollow();
  else startFollow(panelHex);
  if (flightMap.has(panelHex)) showPanel(flightMap.get(panelHex));
});

// ── keyboard shortcuts ─────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
  switch (e.key.toLowerCase()) {
    case 'l': toggleLabels();  break;
    case 't': toggleTrails();  break;
    case 's': toggleStalks();  break;
    case 'p': togglePredict(); break;
    case 'd': toggleDetail();  break;
    case 'n': toggleNight();   break;
    case 'escape':
      document.getElementById('info-panel').classList.remove('open');
      stopFollow();
      break;
    case '+': case '=': map.easeTo({ zoom: map.getZoom()+0.8, duration: 300 }); break;
    case '-': map.easeTo({ zoom: map.getZoom()-0.8, duration: 300 }); break;
  }
});
</script>
