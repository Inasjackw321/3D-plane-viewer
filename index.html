<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live 3D Flight Tracker</title>
  <script src="//unpkg.com/globe.gl"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #globe { width: 100%; height: 100%; }

    /* ── overlay ─────────────────────────────────────────────── */
    #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    /* ── header ──────────────────────────────────────────────── */
    #header {
      position: absolute; top: 16px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 16px;
      background: rgba(4,8,20,.84);
      border: 1px solid rgba(80,160,255,.22);
      border-radius: 14px; padding: 10px 20px;
      backdrop-filter: blur(14px);
      pointer-events: all; white-space: nowrap; user-select: none;
    }
    #header h1 { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
    #header h1 .live { color: #ff5500; }
    .hdiv { width: 1px; height: 26px; background: rgba(255,255,255,.1); }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .stat-v { font-size: 17px; font-weight: 800; color: #ff6620; line-height: 1; }
    .stat-l { font-size: 9px; color: rgba(255,255,255,.38); text-transform: uppercase; letter-spacing: 1px; }

    /* ── region pill strip ───────────────────────────────────── */
    #regions {
      position: absolute; top: 72px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px;
      pointer-events: all;
    }
    .rbtn {
      padding: 5px 13px;
      background: rgba(4,8,20,.78);
      border: 1px solid rgba(80,160,255,.22);
      border-radius: 20px;
      color: rgba(255,255,255,.55);
      font-size: 11px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      backdrop-filter: blur(10px);
      transition: background .15s, border-color .15s, color .15s;
    }
    .rbtn:hover  { background: rgba(255,85,0,.2);  border-color: rgba(255,85,0,.5); color: #fff; }
    .rbtn.active { background: rgba(255,85,0,.32); border-color: #ff5500;           color: #fff; }

    /* ── info panel ──────────────────────────────────────────── */
    #info-panel {
      position: absolute; top: 112px; right: 16px;
      width: 248px;
      background: rgba(4,8,20,.9);
      border: 1px solid rgba(80,160,255,.25);
      border-radius: 14px; padding: 16px;
      pointer-events: all; backdrop-filter: blur(14px);
      display: none;
    }
    #info-panel.open { display: block; }
    #info-close {
      position: absolute; top: 9px; right: 12px;
      background: none; border: none;
      color: rgba(255,255,255,.3); cursor: pointer;
      font-size: 20px; line-height: 1; padding: 2px 5px;
      transition: color .15s;
    }
    #info-close:hover { color: #fff; }
    .i-cs   { font-size: 23px; font-weight: 800; color: #fff; margin-bottom: 2px; }
    .i-ctry { font-size: 11px; color: rgba(255,255,255,.36); margin-bottom: 12px; }
    .i-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .i-cell label {
      display: block; font-size: 9px; color: rgba(255,255,255,.36);
      text-transform: uppercase; letter-spacing: .9px; margin-bottom: 2px;
    }
    .i-cell span { font-size: 14px; font-weight: 700; color: #ff8844; }

    /* ── controls ────────────────────────────────────────────── */
    #controls {
      position: absolute; bottom: 54px; right: 16px;
      display: flex; flex-direction: column; gap: 6px;
      pointer-events: all;
    }
    .ctl {
      width: 38px; height: 38px;
      background: rgba(4,8,20,.82);
      border: 1px solid rgba(80,160,255,.22);
      border-radius: 9px; color: rgba(255,255,255,.6);
      cursor: pointer; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(10px);
      transition: background .15s, border-color .15s, color .15s;
    }
    .ctl:hover  { background: rgba(255,85,0,.22); border-color: #ff5500; color: #fff; }
    .ctl.active { background: rgba(255,85,0,.35); border-color: #ff5500; color: #fff; }

    /* ── status bar ──────────────────────────────────────────── */
    #status-bar {
      position: absolute; bottom: 14px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 7px;
      background: rgba(4,8,20,.72);
      border: 1px solid rgba(80,160,255,.15);
      border-radius: 20px; padding: 5px 14px;
      pointer-events: none; backdrop-filter: blur(8px);
    }
    .s-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #00e87a;
      animation: blink 2s ease-in-out infinite;
    }
    .s-dot.warn { background: #ffaa00; animation: none; }
    .s-dot.err  { background: #ff4040; animation: none; }
    .s-dot.load { background: #4499ff; animation: none; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.2} }
    #status-msg { font-size: 11px; color: rgba(255,255,255,.48); }

    /* ── splash ──────────────────────────────────────────────── */
    #splash {
      position: fixed; inset: 0; background: #010409;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      z-index: 999; transition: opacity .5s;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    .spin {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,85,0,.18);
      border-top-color: #ff5500; border-radius: 50%;
      animation: rot .8s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
    #splash p { font-size: 13px; color: rgba(255,255,255,.42); }

    /* ── globe.gl tooltip ────────────────────────────────────── */
    .globe-tip {
      background: rgba(4,8,20,.9) !important;
      border: 1px solid rgba(80,160,255,.28) !important;
      border-radius: 10px !important;
      padding: 8px 12px !important;
      font-size: 12px !important; color: #fff !important;
      pointer-events: none; line-height: 1.6;
    }
  </style>
</head>
<body>

<div id="globe"></div>

<div id="splash">
  <div class="spin"></div>
  <p>Loading globe…</p>
</div>

<div id="overlay">

  <div id="header">
    <h1>✈ <span class="live">LIVE</span> FLIGHTS</h1>
    <div class="hdiv"></div>
    <div class="stat">
      <div class="stat-v" id="hdr-count">—</div>
      <div class="stat-l">Aircraft</div>
    </div>
    <div class="hdiv"></div>
    <div class="stat">
      <div class="stat-v" id="hdr-time">—</div>
      <div class="stat-l">Updated</div>
    </div>
  </div>

  <!-- Region selector -->
  <div id="regions">
    <button class="rbtn active" data-region="middle_east">Middle East</button>
    <button class="rbtn"        data-region="europe">Europe</button>
    <button class="rbtn"        data-region="north_america">N. America</button>
    <button class="rbtn"        data-region="asia">Asia Pacific</button>
    <button class="rbtn"        data-region="global">Global</button>
  </div>

  <!-- Flight info -->
  <div id="info-panel">
    <button id="info-close">×</button>
    <div class="i-cs"   id="i-cs">—</div>
    <div class="i-ctry" id="i-ctry">—</div>
    <div class="i-grid">
      <div class="i-cell"><label>Altitude</label><span id="i-alt">—</span></div>
      <div class="i-cell"><label>Speed</label>   <span id="i-spd">—</span></div>
      <div class="i-cell"><label>Heading</label> <span id="i-hdg">—</span></div>
      <div class="i-cell"><label>ICAO24</label>  <span id="i-icao">—</span></div>
    </div>
  </div>

  <div id="controls">
    <button class="ctl" id="btn-home" title="Reset view">🌍</button>
    <button class="ctl" id="btn-spin" title="Auto-rotate">🔄</button>
    <button class="ctl" id="btn-day"  title="Toggle day/night">🌓</button>
  </div>

  <div id="status-bar">
    <div class="s-dot" id="s-dot"></div>
    <span id="status-msg">Initializing…</span>
  </div>

</div>

<script>
// ──────────────────────────────────────────────────────────────
// Region config  (camera views + api key)
// ──────────────────────────────────────────────────────────────
const REGIONS = {
  middle_east:   { lat: 27,  lng: 45,   alt: 1.5 },
  europe:        { lat: 52,  lng: 15,   alt: 1.8 },
  north_america: { lat: 38,  lng: -95,  alt: 1.8 },
  asia:          { lat: 25,  lng: 105,  alt: 1.8 },
  global:        { lat: 20,  lng: 0,    alt: 2.5 },
};

const CFG = {
  refreshMs:  15_000,
  maxTrail:   8,
  maxFlights: 6_000,
};

let currentRegion = 'middle_east';

// ──────────────────────────────────────────────────────────────
// Globe
// ──────────────────────────────────────────────────────────────
const EARTH_NIGHT = '//unpkg.com/three-globe/example/img/earth-night.jpg';
const EARTH_DAY   = '//unpkg.com/three-globe/example/img/earth-blue-marble.jpg';
const EARTH_BUMP  = '//unpkg.com/three-globe/example/img/earth-topology.png';
const SKY         = '//unpkg.com/three-globe/example/img/night-sky.png';

const world = Globe()(document.getElementById('globe'))
  .globeImageUrl(EARTH_NIGHT)
  .bumpImageUrl(EARTH_BUMP)
  .backgroundImageUrl(SKY)
  .showAtmosphere(true)
  .atmosphereColor('#1a66ff')
  .atmosphereAltitude(0.18)
  .pointsData([])
  .pointLat('lat')
  .pointLng('lon')
  .pointAltitude(d => Math.max(d.alt / 800_000, 0.005))
  .pointColor('color')
  .pointRadius(0.28)
  .pointLabel(d =>
    `<div class="globe-tip">
       <b style="color:#ff8844">${d.callsign}</b><br>
       ${d.country}<br>
       ${fmtFt(d.alt)} · ${fmtKts(d.speedMs)}
     </div>`)
  .onPointClick(showInfo)
  .pathsData([])
  .pathPoints('points')
  .pathPointLat(p => p.lat)
  .pathPointLng(p => p.lon)
  .pathPointAlt(p => Math.max(p.alt / 800_000, 0.005))
  .pathColor(() => ['rgba(255,255,255,0.7)', 'rgba(255,255,255,0.02)'])
  .pathStroke(0.4)
  .pathDashLength(0.02)
  .pathDashGap(0.006)
  .pathDashAnimateTime(8_000);

// Start looking at Middle East
const r0 = REGIONS.middle_east;
world.pointOfView({ lat: r0.lat, lng: r0.lng, altitude: r0.alt }, 0);

world.onGlobeReady(() => document.getElementById('splash').classList.add('gone'));

// ──────────────────────────────────────────────────────────────
// State
// ──────────────────────────────────────────────────────────────
const trailHistory = new Map();
let nightMode = true;

// ──────────────────────────────────────────────────────────────
// Helpers
// ──────────────────────────────────────────────────────────────
function fmtFt(m)  { return m != null ? `${Math.round(m * 3.28084).toLocaleString()} ft` : 'N/A'; }
function fmtKts(s) { return s != null ? `${Math.round(s * 1.94384)} kts` : 'N/A'; }
function fmtHdg(d) {
  if (d == null) return 'N/A';
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return `${Math.round(d)}° ${dirs[Math.round(d / 45) % 8]}`;
}
function setStatus(type, msg) {
  document.getElementById('s-dot').className = 's-dot' + (type !== 'ok' ? ` ${type}` : '');
  document.getElementById('status-msg').textContent = msg;
}
function showInfo(d) {
  if (!d) return;
  document.getElementById('i-cs').textContent   = d.callsign || d.icao || '—';
  document.getElementById('i-ctry').textContent = d.country  || 'Unknown';
  document.getElementById('i-alt').textContent  = fmtFt(d.alt);
  document.getElementById('i-spd').textContent  = fmtKts(d.speedMs);
  document.getElementById('i-hdg').textContent  = fmtHdg(d.heading);
  document.getElementById('i-icao').textContent = (d.icao || '').toUpperCase();
  document.getElementById('info-panel').classList.add('open');
}

// ──────────────────────────────────────────────────────────────
// Fetch via local Python proxy (bypasses CORS)
// ──────────────────────────────────────────────────────────────
async function fetchStates(region) {
  try {
    const r = await fetch(`/api/flights?region=${region}`, {
      signal: AbortSignal.timeout(18_000),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j.states ?? [];
  } catch (e) {
    console.warn('[flights]', e.message);
    return null;
  }
}

// ──────────────────────────────────────────────────────────────
// Update loop
// ──────────────────────────────────────────────────────────────
async function update() {
  setStatus('load', 'Fetching flight data…');

  const states = await fetchStates(currentRegion);
  if (!states) {
    setStatus('err', 'Could not reach OpenSky — retrying in 15 s');
    return;
  }

  const flights = [];
  const trails  = [];
  const seen    = new Set();
  let   count   = 0;

  for (const s of states) {
    if (count >= CFG.maxFlights) break;
    const icao     = s[0];
    const callsign = (s[1] ?? '').trim() || icao;
    const country  = s[2] ?? 'Unknown';
    const lon      = s[5], lat = s[6];
    const baroAlt  = s[7], onGround = s[8];
    const speedMs  = s[9], heading  = s[10];
    const alt      = baroAlt ?? s[13] ?? 0;

    if (lon == null || lat == null || onGround) continue;
    if (Math.abs(lon) > 180 || Math.abs(lat) > 90) continue;

    seen.add(icao); count++;

    // Altitude-based colour: orange at low → white-blue at cruise
    const ratio = Math.min(alt / 12_000, 1);
    const color  = `rgb(255,${Math.round(102 + 153 * ratio)},${Math.round(255 * ratio)})`;

    flights.push({ icao, callsign, country, lat, lon, alt, speedMs, heading, color });

    const hist = trailHistory.get(icao) ?? [];
    hist.push({ lat, lon, alt });
    if (hist.length > CFG.maxTrail) hist.shift();
    trailHistory.set(icao, hist);
    if (hist.length >= 2) trails.push({ icao, points: [...hist] });
  }

  for (const id of trailHistory.keys()) if (!seen.has(id)) trailHistory.delete(id);

  world.pointsData(flights).pathsData(trails);

  const now = new Date();
  document.getElementById('hdr-count').textContent = flights.length.toLocaleString();
  document.getElementById('hdr-time').textContent  = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  setStatus('ok', `${flights.length.toLocaleString()} aircraft · next update in 15 s`);
}

// ──────────────────────────────────────────────────────────────
// Region buttons
// ──────────────────────────────────────────────────────────────
document.querySelectorAll('.rbtn').forEach(btn => {
  btn.addEventListener('click', function () {
    if (this.dataset.region === currentRegion) return;
    document.querySelectorAll('.rbtn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentRegion = this.dataset.region;
    trailHistory.clear();
    world.pathsData([]);
    const r = REGIONS[currentRegion];
    world.pointOfView({ lat: r.lat, lng: r.lng, altitude: r.alt }, 1200);
    update();
  });
});

// ──────────────────────────────────────────────────────────────
// Control buttons
// ──────────────────────────────────────────────────────────────
document.getElementById('info-close').addEventListener('click', () =>
  document.getElementById('info-panel').classList.remove('open')
);

document.getElementById('btn-home').addEventListener('click', () => {
  const r = REGIONS[currentRegion];
  world.pointOfView({ lat: r.lat, lng: r.lng, altitude: r.alt }, 1000);
});

let spinning = false;
document.getElementById('btn-spin').addEventListener('click', function () {
  spinning = !spinning;
  this.classList.toggle('active', spinning);
  world.controls().autoRotate      = spinning;
  world.controls().autoRotateSpeed = 0.5;
});

document.getElementById('btn-day').addEventListener('click', function () {
  nightMode = !nightMode;
  this.classList.toggle('active', !nightMode);
  world.globeImageUrl(nightMode ? EARTH_NIGHT : EARTH_DAY);
});

// ──────────────────────────────────────────────────────────────
// Start
// ──────────────────────────────────────────────────────────────
update();
setInterval(update, CFG.refreshMs);
</script>
</body>
</html>
